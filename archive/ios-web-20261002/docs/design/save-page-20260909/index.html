<!DOCTYPE html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LumiPortrait 保存页设计</title><style>body{margin:0;background:#0e1012;color:#f5f5f5;font:15px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;padding:36px}h1{font-size:26px;margin:0 0 10px}p{color:#a9adb3;line-height:1.7}main{display:flex;gap:30px;flex-wrap:wrap}figure{margin:12px 0}img{width:min(393px,calc(100vw - 72px));border-radius:24px;border:1px solid #35373a}figcaption{margin:12px 0;color:#a9adb3}</style><h1>保存照片</h1><p>炭黑面板 · 珊瑚色主操作 · 底部固定保存与分享<br>393 × 852 pt 基准；预览为矢量示意图，应用内显示用户当前编辑结果。尺寸数值为设计示例。</p><main><figure><img src="save-default.svg"><figcaption>JPEG · 默认状态</figcaption></figure><figure><img src="save-png.svg"><figcaption>PNG · 收起无效画质选项</figcaption></figure><figure><img src="save-success.svg"><figcaption>保存成功 · 仅真实写入成功后展示</figcaption></figure></main></html>
